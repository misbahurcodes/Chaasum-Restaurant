    <script>
      // Gracefully prevent benign WebSocket disconnection errors from bubbling in preview iframe
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('createWebSocket') !== -1)) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var str = String(e.reason || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocket') !== -1) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
